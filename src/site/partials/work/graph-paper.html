<section class="work gen" id="tool" aria-label="Graph paper generator">
  <div class="work-body">
    <form class="gen-controls" id="gen-form">
      <div class="field">
        <label class="label" for="kind">Paper type</label>
        <select class="select" id="kind" name="kind">
          <option value="square" selected>Graph paper (square grid)</option>
          <option value="mm">Millimeter paper, bold every 1 cm</option>
          <option value="dots">Dot grid</option>
          <option value="iso">Isometric (triangles)</option>
          <option value="lined">Lined writing paper</option>
        </select>
      </div>
      <div class="gen-row">
        <div class="field">
          <span class="label" id="lbl-paper">Paper</span>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-paper">
            <input
              type="radio"
              name="paper"
              id="paper-a4"
              value="a4"
              checked
            /><label for="paper-a4">A4</label>
            <input
              type="radio"
              name="paper"
              id="paper-letter"
              value="letter"
            /><label for="paper-letter">Letter</label>
          </div>
        </div>
        <div class="field">
          <span class="label" id="lbl-orient">Orientation</span>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-orient">
            <input
              type="radio"
              name="orient"
              id="or-p"
              value="portrait"
              checked
            /><label for="or-p" aria-label="Portrait">Tall</label>
            <input
              type="radio"
              name="orient"
              id="or-l"
              value="landscape"
            /><label for="or-l" aria-label="Landscape">Wide</label>
          </div>
        </div>
      </div>
      <div class="field" data-kinds="square dots iso lined">
        <span class="label" id="lbl-unit">Units</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-unit">
          <input
            type="radio"
            name="unit"
            id="unit-mm"
            value="mm"
            checked
          /><label for="unit-mm">Millimeters</label>
          <input type="radio" name="unit" id="unit-in" value="in" /><label
            for="unit-in"
            >Inches</label
          >
        </div>
      </div>
      <div class="field" data-kinds="square dots iso lined">
        <label class="label" for="step"
          ><span data-kinds="square dots iso">Square size</span
          ><span data-kinds="lined" hidden>Line spacing</span></label
        >
        <div class="unit-input">
          <input
            class="input"
            type="number"
            id="step"
            name="step"
            value="5"
            min="0.04"
            max="200"
            step="0.5"
            inputmode="decimal"
          />
          <span id="step-unit">mm</span>
        </div>
        <div
          class="drop-actions"
          id="step-presets"
          style="justify-content: flex-start"
        ></div>
      </div>
      <div class="field" data-kinds="square">
        <label class="label" for="major">Bold line every</label>
        <select class="select" id="major" name="major">
          <option value="0" selected>No bold lines</option>
          <option value="2">2 squares</option>
          <option value="4">4 squares</option>
          <option value="5">5 squares</option>
          <option value="10">10 squares</option>
        </select>
      </div>
      <div class="gen-checks" data-kinds="lined" hidden>
        <label class="gen-check"
          ><input type="checkbox" name="marginline" checked /><span
            >Red margin line</span
          ></label
        >
        <label class="gen-check"
          ><input type="checkbox" name="header" /><span
            >Space for a name and date at the top</span
          ></label
        >
      </div>
      <div class="field">
        <div class="preview-head">
          <label class="label" for="weight">Line thickness</label>
          <span class="hint tnum" id="weight-out">0.35 pt</span>
        </div>
        <input
          type="range"
          id="weight"
          name="weight"
          min="0.1"
          max="1.5"
          step="0.05"
          value="0.35"
        />
      </div>
      <fieldset>
        <legend class="label">Line color</legend>
        <div class="swatches">
          <input
            type="radio"
            name="color"
            id="c-grey"
            value="#8c8c8c"
            checked
          /><label for="c-grey" style="--sw: #8c8c8c" title="Gray"
            ><span class="visually-hidden">Gray</span></label
          >
          <input type="radio" name="color" id="c-blue" value="#6a9bd8" /><label
            for="c-blue"
            style="--sw: #6a9bd8"
            title="Light blue"
            ><span class="visually-hidden">Light blue</span></label
          >
          <input type="radio" name="color" id="c-green" value="#5fae7e" /><label
            for="c-green"
            style="--sw: #5fae7e"
            title="Green"
            ><span class="visually-hidden">Green</span></label
          >
          <input
            type="radio"
            name="color"
            id="c-orange"
            value="#e39a55"
          /><label for="c-orange" style="--sw: #e39a55" title="Orange"
            ><span class="visually-hidden">Orange</span></label
          >
          <input type="radio" name="color" id="c-black" value="#000000" /><label
            for="c-black"
            style="--sw: #000000"
            title="Black"
            ><span class="visually-hidden">Black</span></label
          >
        </div>
      </fieldset>
      <div class="gen-row">
        <div class="field">
          <label class="label" for="margin">Margins</label>
          <div class="unit-input">
            <input
              class="input"
              type="number"
              id="margin"
              name="margin"
              value="10"
              min="0"
              max="40"
              step="1"
              inputmode="decimal"
            /><span>mm</span>
          </div>
        </div>
        <div class="field">
          <label class="label" for="pages">Pages</label>
          <input
            class="input"
            type="number"
            id="pages"
            name="pages"
            value="1"
            min="1"
            max="100"
            step="1"
            inputmode="numeric"
          />
        </div>
      </div>
      <p class="gen-tip">
        Print at Actual size or 100% so each square is exactly the size you
        chose. Most printers leave 3 to 5 mm blank at the edges.
      </p>
    </form>
    <div class="gen-stage">
      <div class="preview-head">
        <span class="label">Preview</span>
        <span class="hint tnum" id="gen-sum"></span>
      </div>
      <p class="drop-error" id="gen-error" role="alert" hidden></p>
      <div class="gen-pages" id="gen-pages" aria-live="polite"></div>
    </div>
  </div>
  <div class="work-foot">
    <span class="privacy-note"
      ><svg class="i"><use href="#i-device" /></svg>Made in your browser.
      Nothing is uploaded.</span
    >
    <span class="spacer"></span>
    <button class="btn" type="button" id="pdf-btn">
      <svg class="i"><use href="#i-upload" transform="rotate(180 10 10)" /></svg
      >Download PDF
    </button>
    <button class="btn btn-primary btn-lg" type="button" id="print-btn">
      <svg class="i"><use href="#i-printer" /></svg>Print
    </button>
  </div>
</section>
