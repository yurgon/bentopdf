<section class="work gen" id="tool" aria-label="Bingo card generator">
  <div class="work-body">
    <form class="gen-controls" id="gen-form">
      <div class="field">
        <span class="label" id="lbl-src">What goes on the cards</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-src">
          <input
            type="radio"
            name="source"
            id="src-words"
            value="words"
            checked
          /><label for="src-words">My words</label>
          <input
            type="radio"
            name="source"
            id="src-theme"
            value="theme"
          /><label for="src-theme">Theme</label>
          <input
            type="radio"
            name="source"
            id="src-num"
            value="numbers"
          /><label for="src-num">Numbers</label>
        </div>
      </div>
      <div class="field" data-source="words">
        <label class="label" for="words">Words or phrases, one per line</label>
        <textarea
          class="input"
          id="words"
          name="words"
          rows="6"
          spellcheck="true"
        >
Pizza
Birthday cake
Balloons
Party hat
Candles
Presents
Dancing
Music
Games
Ice cream
Lemonade
Cupcakes
Confetti
Streamers
Friends
Photos
Piñata
Sparklers
Card
Ribbon
Wrapping paper
Make a wish
Sing along
Party bags
Surprise
Cookies
Popcorn
Sandwiches</textarea
        >
        <span class="hint" id="words-info"></span>
      </div>
      <div class="field" data-source="theme" hidden>
        <label class="label" for="theme">Theme</label>
        <select class="select" id="theme" name="theme"></select>
      </div>
      <p class="gen-tip" data-source="numbers" hidden>
        Classic columns: B 1 to 15, I 16 to 30, N 31 to 45, G 46 to 60, O 61 to
        75.
      </p>
      <div class="gen-row">
        <div class="field">
          <span class="label" id="lbl-size">Grid</span>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-size">
            <input type="radio" name="size" id="size-3" value="3" /><label
              for="size-3"
              >3×3</label
            >
            <input type="radio" name="size" id="size-4" value="4" /><label
              for="size-4"
              >4×4</label
            >
            <input
              type="radio"
              name="size"
              id="size-5"
              value="5"
              checked
            /><label for="size-5">5×5</label>
          </div>
        </div>
      </div>
      <label class="gen-check"
        ><input type="checkbox" name="free" checked /><span
          >Free square in the center<small
            >Only on 3×3 and 5×5 cards</small
          ></span
        ></label
      >
      <div class="gen-row">
        <div class="field">
          <label class="label" for="count">Number of cards</label>
          <input
            class="input"
            type="number"
            id="count"
            name="count"
            value="30"
            min="1"
            max="1000"
            step="1"
            inputmode="numeric"
          />
        </div>
        <div class="field">
          <span class="label" id="lbl-per">Cards per page</span>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-per">
            <input type="radio" name="per" id="per-1" value="1" /><label
              for="per-1"
              >1</label
            >
            <input type="radio" name="per" id="per-2" value="2" checked /><label
              for="per-2"
              >2</label
            >
            <input type="radio" name="per" id="per-4" value="4" /><label
              for="per-4"
              >4</label
            >
          </div>
        </div>
      </div>
      <div class="field">
        <label class="label" for="title">Title</label>
        <input
          class="input"
          type="text"
          id="title"
          name="title"
          value="BINGO"
          maxlength="60"
          autocomplete="off"
        />
      </div>
      <fieldset>
        <legend class="label">Color</legend>
        <div class="swatches">
          <input
            type="radio"
            name="color"
            id="c-1"
            value="#c2410c"
            checked
          /><label for="c-1" style="--sw: #c2410c" title="Orange"
            ><span class="visually-hidden">Orange</span></label
          >
          <input type="radio" name="color" id="c-2" value="#be185d" /><label
            for="c-2"
            style="--sw: #be185d"
            title="Pink"
            ><span class="visually-hidden">Pink</span></label
          >
          <input type="radio" name="color" id="c-3" value="#6d28d9" /><label
            for="c-3"
            style="--sw: #6d28d9"
            title="Purple"
            ><span class="visually-hidden">Purple</span></label
          >
          <input type="radio" name="color" id="c-4" value="#1d4ed8" /><label
            for="c-4"
            style="--sw: #1d4ed8"
            title="Blue"
            ><span class="visually-hidden">Blue</span></label
          >
          <input type="radio" name="color" id="c-5" value="#047857" /><label
            for="c-5"
            style="--sw: #047857"
            title="Green"
            ><span class="visually-hidden">Green</span></label
          >
          <input type="radio" name="color" id="c-6" value="#262626" /><label
            for="c-6"
            style="--sw: #262626"
            title="Black"
            ><span class="visually-hidden">Black</span></label
          >
        </div>
      </fieldset>
      <div class="field">
        <span class="label" id="lbl-text">Text size</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-text">
          <input type="radio" name="text" id="t-s" value="s" /><label for="t-s"
            >Small</label
          >
          <input type="radio" name="text" id="t-m" value="m" checked /><label
            for="t-m"
            >Medium</label
          >
          <input type="radio" name="text" id="t-l" value="l" /><label for="t-l"
            >Large</label
          >
        </div>
        <span class="hint"
          >Long words shrink and wrap to stay inside their square.</span
        >
      </div>
      <div class="field">
        <span class="label" id="lbl-paper">Paper</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-paper">
          <input
            type="radio"
            name="paper"
            id="paper-a4"
            value="a4"
            checked
          /><label for="paper-a4">A4</label>
          <input
            type="radio"
            name="paper"
            id="paper-letter"
            value="letter"
          /><label for="paper-letter">Letter</label>
        </div>
      </div>
      <fieldset>
        <legend class="label">Also print</legend>
        <div class="gen-checks">
          <label class="gen-check"
            ><input type="checkbox" name="caller" checked /><span
              >Caller sheet<small
                >Every word or number with a box to tick</small
              ></span
            ></label
          >
          <label class="gen-check"
            ><input type="checkbox" name="calls" checked /><span
              >Calling cards<small
                >Cut them out and draw one at a time</small
              ></span
            ></label
          >
        </div>
      </fieldset>
    </form>
    <div class="gen-stage">
      <div class="preview-head">
        <span class="label">Preview</span>
        <span class="hint tnum" id="gen-sum"></span>
      </div>
      <p class="drop-error" id="gen-error" role="alert" hidden></p>
      <div class="gen-pages" id="gen-pages" aria-live="polite"></div>
      <div class="drop-actions" style="justify-content: flex-start">
        <button class="btn btn-sm" type="button" id="shuffle-btn">
          <svg class="i i-sm"><use href="#i-rotate" /></svg>New set of cards
        </button>
      </div>
    </div>
  </div>
  <div class="work-foot">
    <span class="privacy-note"
      ><svg class="i"><use href="#i-device" /></svg>Made in your browser.
      Nothing is uploaded.</span
    >
    <span class="spacer"></span>
    <button class="btn" type="button" id="pdf-btn">
      <svg class="i"><use href="#i-upload" transform="rotate(180 10 10)" /></svg
      >Download PDF
    </button>
    <button class="btn btn-primary btn-lg" type="button" id="print-btn">
      <svg class="i"><use href="#i-printer" /></svg>Print
    </button>
  </div>
</section>
