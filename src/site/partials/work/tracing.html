<section class="work gen" id="tool" aria-label="Name tracing worksheet maker">
  <div class="work-body">
    <form class="gen-controls" id="gen-form">
      <div class="field">
        <label class="label" for="names">Name, or a list of names</label>
        <textarea
          class="input"
          id="names"
          name="names"
          rows="3"
          spellcheck="false"
          autocomplete="off"
        >
Emma</textarea
        >
        <span class="hint"
          >One name per line. Each name gets its own sheet in one file.</span
        >
      </div>
      <div class="field">
        <span class="label" id="lbl-style">Letters</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-style">
          <input
            type="radio"
            name="style"
            id="st-print"
            value="print"
            checked
          /><label for="st-print">Print</label>
          <input
            type="radio"
            name="style"
            id="st-cursive"
            value="cursive"
          /><label for="st-cursive">Cursive</label>
        </div>
      </div>
      <div class="field">
        <span class="label" id="lbl-letters">Line</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-letters">
          <input
            type="radio"
            name="letters"
            id="ln-dash"
            value="dashed"
            checked
          /><label for="ln-dash">Dashed</label>
          <input type="radio" name="letters" id="ln-dot" value="dotted" /><label
            for="ln-dot"
            >Dotted</label
          >
        </div>
      </div>
      <div class="field">
        <span class="label" id="lbl-size">Letter size</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-size">
          <input type="radio" name="size" id="sz-s" value="s" /><label
            for="sz-s"
            >Small</label
          >
          <input type="radio" name="size" id="sz-m" value="m" /><label
            for="sz-m"
            >Medium</label
          >
          <input type="radio" name="size" id="sz-l" value="l" checked /><label
            for="sz-l"
            >Large</label
          >
        </div>
        <span class="hint">Top line to base line: 12, 17 or 24 mm.</span>
      </div>
      <div class="gen-row">
        <div class="field">
          <label class="label" for="traced">Rows to trace</label>
          <input
            class="input"
            type="number"
            id="traced"
            name="traced"
            value="4"
            min="1"
            max="20"
            step="1"
            inputmode="numeric"
          />
        </div>
        <div class="field">
          <label class="label" for="empty">Empty rows</label>
          <input
            class="input"
            type="number"
            id="empty"
            name="empty"
            value="2"
            min="0"
            max="20"
            step="1"
            inputmode="numeric"
          />
        </div>
      </div>
      <div class="gen-checks">
        <label class="gen-check"
          ><input type="checkbox" name="guides" checked /><span
            >Start dots and arrows<small
              >On the first row: where each stroke begins and which way it
              goes</small
            ></span
          ></label
        >
        <label class="gen-check"
          ><input type="checkbox" name="repeat" checked /><span
            >Repeat the name along each row</span
          ></label
        >
        <label class="gen-check"
          ><input type="checkbox" name="header" checked /><span
            >Name and date line at the top</span
          ></label
        >
      </div>
      <div class="field">
        <span class="label" id="lbl-paper">Paper</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-paper">
          <input
            type="radio"
            name="paper"
            id="paper-a4"
            value="a4"
            checked
          /><label for="paper-a4">A4</label>
          <input
            type="radio"
            name="paper"
            id="paper-letter"
            value="letter"
          /><label for="paper-letter">Letter</label>
        </div>
      </div>
    </form>
    <div class="gen-stage">
      <div class="preview-head">
        <span class="label">Preview</span>
        <span class="hint tnum" id="gen-sum"></span>
      </div>
      <p class="drop-error" id="gen-error" role="alert" hidden></p>
      <div class="gen-pages" id="gen-pages" aria-live="polite"></div>
    </div>
  </div>
  <div class="work-foot">
    <span class="privacy-note"
      ><svg class="i"><use href="#i-device" /></svg>Made in your browser. Names
      are not uploaded.</span
    >
    <span class="spacer"></span>
    <button class="btn" type="button" id="pdf-btn">
      <svg class="i"><use href="#i-upload" transform="rotate(180 10 10)" /></svg
      >Download PDF
    </button>
    <button class="btn btn-primary btn-lg" type="button" id="print-btn">
      <svg class="i"><use href="#i-printer" /></svg>Print
    </button>
  </div>
</section>
