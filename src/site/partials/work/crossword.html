<section class="work gen" id="tool" aria-label="Crossword puzzle maker">
  <div class="work-body">
    <form class="gen-controls" id="gen-form">
      <div class="field">
        <label class="label" for="title">Title</label>
        <input
          class="input"
          type="text"
          id="title"
          name="title"
          value="Space crossword"
          maxlength="80"
          autocomplete="off"
        />
      </div>
      <div class="field">
        <label class="label" for="words"
          >Words and clues, one pair per line</label
        >
        <textarea
          class="input"
          id="words"
          name="words"
          rows="10"
          spellcheck="true"
        >
planet - Earth is one of the eight
star - The Sun is the closest one to us
comet - Icy visitor with a glowing tail
orbit - The path a planet takes around the Sun
galaxy - The Milky Way is our home one
moon - It goes around the Earth about once a month
asteroid - Rocky body, many circle between Mars and Jupiter
meteor - A shooting star in the night sky
telescope - Tool that makes faraway things look closer
astronaut - Person who travels into space</textarea
        >
        <span class="hint"
          >Put a dash, a colon or a tab between the word and its clue. You can
          paste two columns from a spreadsheet.</span
        >
        <span class="hint" id="words-info" aria-live="polite"></span>
      </div>
      <fieldset>
        <legend class="label">On the sheet</legend>
        <div class="gen-checks">
          <label class="gen-check"
            ><input type="checkbox" name="nameline" checked /><span
              >Name and date line</span
            ></label
          >
          <label class="gen-check"
            ><input type="checkbox" name="bank" /><span
              >Word bank<small
                >Lists the answers, for younger students</small
              ></span
            ></label
          >
          <label class="gen-check"
            ><input type="checkbox" name="key" checked /><span
              >Answer key<small
                >A separate page with the grid filled in</small
              ></span
            ></label
          >
        </div>
      </fieldset>
      <div class="field">
        <span class="label" id="lbl-paper">Paper</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-paper">
          <input
            type="radio"
            name="paper"
            id="paper-a4"
            value="a4"
            checked
          /><label for="paper-a4">A4</label>
          <input
            type="radio"
            name="paper"
            id="paper-letter"
            value="letter"
          /><label for="paper-letter">Letter</label>
        </div>
      </div>
    </form>
    <div class="gen-stage">
      <div class="preview-head">
        <span class="label">Preview</span>
        <span class="hint tnum" id="gen-sum"></span>
      </div>
      <p class="drop-error" id="gen-error" role="alert" hidden></p>
      <div class="gen-pages" id="gen-pages" aria-live="polite"></div>
      <div class="drop-actions" style="justify-content: flex-start">
        <button class="btn btn-sm" type="button" id="rebuild-btn">
          <svg class="i i-sm"><use href="#i-rotate" /></svg>Rebuild grid
        </button>
      </div>
    </div>
  </div>
  <div class="work-foot">
    <span class="privacy-note"
      ><svg class="i"><use href="#i-device" /></svg>Made in your browser.
      Nothing is uploaded.</span
    >
    <span class="spacer"></span>
    <button class="btn" type="button" id="pdf-btn">
      <svg class="i"><use href="#i-upload" transform="rotate(180 10 10)" /></svg
      >Download PDF
    </button>
    <button class="btn btn-primary btn-lg" type="button" id="print-btn">
      <svg class="i"><use href="#i-printer" /></svg>Print
    </button>
  </div>
</section>
