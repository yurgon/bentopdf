<section class="work gen" id="tool" aria-label="Printer test page">
  <div class="work-body">
    <form class="gen-controls" id="gen-form">
      <div class="field">
        <span class="label" id="lbl-paper">Paper</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-paper">
          <input
            type="radio"
            name="paper"
            id="paper-a4"
            value="a4"
            checked
          /><label for="paper-a4">A4</label>
          <input
            type="radio"
            name="paper"
            id="paper-letter"
            value="letter"
          /><label for="paper-letter">Letter</label>
        </div>
      </div>
      <fieldset>
        <legend class="label">Sheets to print</legend>
        <div class="gen-checks">
          <label class="gen-check"
            ><input type="checkbox" name="sheet" value="black" checked /><span
              >Black and white<small
                >Solid black, grey steps, fine lines, small text</small
              ></span
            ></label
          >
          <label class="gen-check"
            ><input type="checkbox" name="sheet" value="color" checked /><span
              >Color<small
                >Cyan, magenta, yellow, black, tints and a spectrum</small
              ></span
            ></label
          >
          <label class="gen-check"
            ><input type="checkbox" name="sheet" value="align" /><span
              >Alignment and margins<small
                >A 100 mm ruler, square grid and edge frames</small
              ></span
            ></label
          >
          <label class="gen-check"
            ><input type="checkbox" name="sheet" value="duplex" /><span
              >Two-sided test<small
                >Front and back on one sheet, the same test the booklet maker
                uses</small
              ></span
            ></label
          >
        </div>
      </fieldset>
      <p class="gen-tip">
        In the print dialog choose Actual size or 100%, not Fit to page, so the
        ruler and frames come out true.
      </p>
    </form>
    <div class="gen-stage">
      <div class="preview-head">
        <span class="label">Preview</span>
        <span class="hint tnum" id="gen-sum"></span>
      </div>
      <p class="drop-error" id="gen-error" role="alert" hidden></p>
      <div class="gen-pages" id="gen-pages" aria-live="polite"></div>
    </div>
  </div>
  <div class="work-foot">
    <span class="privacy-note"
      ><svg class="i"><use href="#i-device" /></svg>Made in your browser.
      Nothing is uploaded.</span
    >
    <span class="spacer"></span>
    <button class="btn" type="button" id="pdf-btn">
      <svg class="i"><use href="#i-upload" transform="rotate(180 10 10)" /></svg
      >Download PDF
    </button>
    <button class="btn btn-primary btn-lg" type="button" id="print-btn">
      <svg class="i"><use href="#i-printer" /></svg>Print
    </button>
  </div>
</section>
